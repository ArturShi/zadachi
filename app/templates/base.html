<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Задачи</title>
  <script src="/static/htmx.min.js"></script>
  <style>
    :root {
      --bg: #0e1116; --panel: #161b23; --panel2: #1d232e; --line: #2a3240;
      --text: #e7eaf0; --muted: #8b94a7; --accent: #5b8cff; --accent2: #7aa2ff;
      --danger: #ff6b6b; --ok: #3ddc97; --hold: #f0b429;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .container { max-width: 1600px; margin: 0 auto; padding: 28px 20px 60px; }
    header.top { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
    h1 { font-size: 26px; margin: 0; letter-spacing: .2px; }
    .count { color: var(--muted); font-size: 14px; }
    .panel {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 12px; padding: 16px; margin-bottom: 16px;
    }
    .panel h2 {
      margin: 0 0 12px; font-size: 12.5px; text-transform: uppercase;
      letter-spacing: .6px; color: var(--muted);
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 12.5px; color: var(--muted); }
    .field.wide { grid-column: 1 / -1; }
    input, select, textarea {
      background: var(--panel2); color: var(--text);
      border: 1px solid var(--line); border-radius: 8px;
      padding: 8px 10px; font: inherit; width: 100%;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
    textarea { resize: vertical; min-height: 56px; }
    input[type="date"] { color-scheme: dark; }
    .add-form input, .add-form select, .add-form textarea { font-size: 12px; }
    button {
      background: var(--accent); color: #fff; border: 0; border-radius: 8px;
      padding: 8px 16px; font: inherit; cursor: pointer;
    }
    button:hover { background: var(--accent2); }
    button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
    button.ghost:hover { border-color: var(--muted); }
    button.danger { background: transparent; border: 1px solid #5a2a2a; color: var(--danger); }
    button.danger:hover { background: #2a1518; border-color: var(--danger); }
    button.small { font-size: 10px; padding: 5px 11px; border-radius: 6px; }
    a.btn {
      display: inline-block; background: var(--accent); color: #fff;
      border: 0; border-radius: 8px; padding: 8px 16px;
      font: inherit; cursor: pointer; text-decoration: none; text-align: center;
    }
    a.btn:hover { background: var(--accent2); }
    a.btn-danger {
      display: inline-block; background: transparent; border: 1px solid #5a2a2a;
      color: var(--danger); border-radius: 8px; padding: 8px 16px;
      font: inherit; cursor: pointer; text-decoration: none; text-align: center;
    }
    a.btn-danger:hover { background: #2a1518; border-color: var(--danger); }
    .btn-stack { display: flex; flex-direction: column; gap: 6px; }
    .row-btns { display: flex; gap: 8px; white-space: nowrap; }
    #task-list, #archiv-list { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left; font-size: 11.5px; text-transform: uppercase;
      letter-spacing: .5px; color: var(--muted); padding: 8px 10px;
      border-bottom: 1px solid var(--line);
    }
    td { padding: 10px; border-bottom: 1px solid #1c2230; vertical-align: top; font-size: 12px; }
    tr:last-child td { border-bottom: 0; }
    .name { font-weight: 400; }
    .date { color: var(--muted); white-space: nowrap; min-width: 90px; }
    .note { color: var(--muted); white-space: pre-wrap; }
    .tag {
      display: inline-block; background: #242c3a; color: var(--text);
      border-radius: 20px; padding: 2px 10px; margin: 1px 4px 1px 0; font-size: 12px;
    }
    select.status-select {
      appearance: none; -webkit-appearance: none; width: auto;
      padding: 3px 26px 3px 12px; border-radius: 20px;
      font-size: 12px; font-weight: 600; cursor: pointer;
      background-image:
        linear-gradient(45deg, transparent 50%, var(--muted) 50%),
        linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position: calc(100% - 14px) 55%, calc(100% - 9px) 55%;
      background-size: 5px 5px; background-repeat: no-repeat;
    }
    .status-new { color: #8b94a7; background: #232a35; }
    .status-work { color: var(--accent2); background: #16233f; }
    .status-done { color: var(--ok); background: #12281f; }
    .status-hold { color: var(--hold); background: #2a2313; }
    .empty { color: var(--muted); text-align: center; padding: 36px 0; margin: 0; }
    .filter-row { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
    .filter-row .field { flex: 1; min-width: 160px; }
    .edit-form { display: grid; grid-template-columns: 2fr 1fr 1.4fr; gap: 10px; }
    .edit-form .note-field { grid-column: 1 / -1; }
    .edit-form .btns { grid-column: 1 / -1; display: flex; gap: 8px; }
    footer { margin-top: 24px; color: var(--muted); font-size: 12.5px; }
  </style>
</head>
<body>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
