{% if tasks %}
<table>
  <thead>
    <tr>
      <th style="width:90px">Создана</th>
      <th style="width:90px">Окончание</th>
      <th style="width:30%">Название</th>
      <th style="width:95px; white-space:nowrap">Статус</th>
      <th style="width:16%">Ответственный</th>
      <th style="width:30%">Примечание</th>
      <th style="width:160px; white-space:nowrap">Действия</th>
    </tr>
  </thead>
  <tbody>
    {% for t in tasks %}{% include "partials/task_row.html" %}{% endfor %}
  </tbody>
</table>
{% else %}
<p class="empty">Нет задач. Добавьте первую задачу выше.</p>
{% endif %}
